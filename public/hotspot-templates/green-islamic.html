<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - $(network-name)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-top: 5px solid #134e5e;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #134e5e;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .welcome h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .quote {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }
        
        .quote::before {
            content: '﷽';
            display: block;
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .quote p {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            color: #333;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #134e5e;
            background: #fff;
        }
        
        .btn-connect {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(19, 78, 94, 0.4);
        }
        
        .card-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #134e5e;
        }
        
        .card-info h3 {
            color: #134e5e;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .info-item {
            text-align: center;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }
        
        .info-item strong {
            color: #134e5e;
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        .info-item span {
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🕌 $(network-name)</h1>
            <p>نظام إدارة شبكات المايكروتك</p>
        </div>
        
        <div class="welcome">
            <h2>بسم الله الرحمن الرحيم</h2>
        </div>
        
        <div class="quote">
            <p>📖 "وقل ربي زدني علماً" 📖</p>
        </div>
        
        $(if error)
        <div class="error">
            $(error)
        </div>
        $(endif)
        
        <form name="sendin" action="$(link-login-only)" method="post">
            <input type="hidden" name="username" />
            <input type="hidden" name="password" />
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
            
            <div class="form-group">
                <label>🎫 رقم الكرت</label>
                <input type="text" name="username" placeholder="أدخل رقم الكرت" required />
            </div>
            
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required />
            </div>
            
            <button type="submit" class="btn-connect">🚀 اتصال بالإنترنت</button>
        </form>
        
        <div class="card-info">
            <h3>📊 معلومات الكرت</h3>
            <div class="info-grid">
                <div class="info-item">
                    <strong>⏱️ المدة</strong>
                    <span>1 ساعة</span>
                </div>
                <div class="info-item">
                    <strong>️ التحميل</strong>
                    <span>غير محدود</span>
                </div>
                <div class="info-item">
                    <strong>⬆️ التنزيل</strong>
                    <span>غير محدود</span>
                </div>
                <div class="info-item">
                    <strong>💾 السعة</strong>
                    <span>500 MB</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by MikroTik RouterOS | JassasNetCard</p>
        </div>
    </div>
</body>
</html>
